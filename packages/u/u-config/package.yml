# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : u-config
version    : 0.35.0
release    : 1
source     :
    - https://github.com/skeeto/u-config/archive/refs/tags/v0.35.0.tar.gz : 271ef3fb4430881c9000b76da21c8b80752f6303d49fc6fedb4987e46ef09240
homepage   : https://github.com/skeeto/u-config
license    : Unlicense
component  : system.devel
summary    : A smaller, simpler, portable pkg-config clone
description: |
    "u-config: a small, simple, portable pkg-config clone"
conflicts  :
    - pkgconf
build      : |
    cc -DPKG_CONFIG_SYSTEM_LIBRARY_PATH="\"/usr/lib64\"" -DPKG_CONFIG_PATH="\"/usr/lib64/pkgconfig\"" -DPKG_CONFIG_LIBDIR="\"/usr/share/pkgconfig\"" -Os -o u-config main_posix.c
install    : |
    %install_bin u-config
    %install_file u-config.1 ${installdir}/usr/share/man/man1/u-config.1
    %install_license UNLICENSE
    ln -sv u-config ${installdir}/usr/bin/pkg-config
    ln -sv u-config.1.zst ${installdir}/usr/share/man/man1/pkg-config.1.zst
